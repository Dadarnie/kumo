# SPDX-License-Identifier: MIT
[package]
name = "kumo"
description = "Kumo for Windows — Kumo lives at the top of your screen"
authors = ["John Paul"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive", "rc"] }
base64 = "0.22"
png = "0.17.16"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Media_Control",
  "Graphics",
  "System",
  "UI_Composition_Desktop",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com_StructuredStorage",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_System_Variant",
  "Win32_Storage_Packaging_Appx",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
# windows 0.61 uses windows-future 0.2; std enables Rust .await for WinRT operations.
windows-future = { version = "0.2", features = ["std"] }
windows-core = "0.61"
# Match Tauri's cached WebView2 bindings; keep their COM trait separate from WinRT 0.61.
webview2-com = "0.39.1"
webview-windows-core = { package = "windows-core", version = "0.62" }
windows-numerics = "0.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
