<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mimo companion study</title>
    <style>
      @import "/src/design/tokens.css";
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: var(--bg); color: var(--ink); font: 14px var(--font); }
      main { max-width: 860px; margin: auto; }
      h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
      p { color: var(--dim); margin: 0 0 24px; line-height: 1.5; }
      .live { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--card); border-radius: 16px; }
      .live canvas { flex: 0 0 auto; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
      button { font: inherit; color: var(--ink); background: var(--control-fill); border: 0; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
      button:hover { background: var(--control-hover); }
      button[aria-pressed="true"] { background: var(--control-hover); box-shadow: inset 0 0 0 1px var(--faint); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      h2 { font-size: 16px; margin: 24px 0 12px; }
      .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 12px; }
      figure { margin: 0; padding: 12px; display: grid; place-items: center; gap: 6px; border-radius: 12px; background: var(--card); }
      figcaption { color: var(--dim); font-size: 12px; }
      .sizes { display: flex; align-items: center; flex-wrap: wrap; gap: 24px; padding: 12px 0; }
      .sizes figure { background: transparent; min-width: 80px; }
      #intro { max-width: 100%; height: auto !important; }
      @media (max-width: 540px) { body { padding: 20px; } .live { gap: 8px; padding: 8px; } .sizes { gap: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Mimo</h1>
      <p>Mimo’s expressions, with soft eyelid transitions and brief, meaningful gestures.</p>
      <div class="live"><canvas id="live" aria-label="Mimo companion"></canvas><div><h2>Curious, calm, and close by.</h2></div></div>
      <div class="controls" role="group" aria-label="Companion reactions"></div>
      <h2>24 expressions</h2><button id="replay-expressions">Replay all gestures</button><div class="samples" id="expressions"></div>
      <h2>Expressions at 32 px</h2><div class="samples" id="compact-expressions"></div>
      <h2>App status</h2><div class="samples" id="states"></div>
      <h2>Actual 32 px output</h2><div class="sizes" id="sizes"></div>
      <h2>Integration identity</h2><div class="samples" id="integrations"></div>
      <h2>Every direction</h2><div class="samples" id="directions"></div>
      <h2>Greeting intro</h2><canvas id="intro" aria-label="Mimo's greeting intro"></canvas><br><button id="replay-intro">Replay intro</button>
    </main>
    <script type="module" src="./mimo-preview.ts"></script>
  </body>
</html>
